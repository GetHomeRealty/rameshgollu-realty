<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Details | Ramesh Gollu | Get Home Realty</title>
  <meta name="description" content="Property details, photos and showing requests with Ramesh Gollu, REALTOR® at Get Home Realty.">
  <meta name="theme-color" content="#d71920">
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="nav-wrap">
  <nav class="nav is-scrolled" aria-label="Primary">
    <a href="index.html" class="brand" aria-label="Home">
      <img class="brand__logo" src="assets/logo.png" alt="Get Home Realty — A Tradition of Trust, Brokerage" width="1000" height="317">
      <span class="brand__text"><span class="brand__name" data-agent="name">Ramesh Gollu</span></span>
    </a>
    <ul class="nav__menu">
      <li><a href="index.html#about">About</a></li>
      <li><a href="listings.html" class="is-active">Listings</a></li>
      <li><a href="index.html#media">Media</a></li>
      <li><a href="index.html#reviews">Reviews</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <a href="index.html#contact" class="btn btn--red btn--sm">Let’s Connect</a>
    <button class="nav__toggle" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="nav-cta-mobile"><a href="index.html#contact" class="btn btn--red">Let’s Connect</a></div>
  </nav>
</header>

<main class="section" style="padding-top:120px">
  <div class="container" id="property">
    <p class="empty">Loading property…</p>
  </div>
</main>

<footer class="footer">
  <div class="container footer__bottom" style="border:0;padding-top:0">
    <span>© <span data-year></span> <span data-agent="name">Ramesh Gollu</span> · REALTOR® / Sales Representative · Get Home Realty</span>
    <span><a href="tel:+14160000000" data-agent-tel data-agent="phone">+1 (416) 000-0000</a></span>
  </div>
</footer>

<div class="mobile-bar" aria-label="Quick contact">
  <a href="tel:+14160000000" class="call" data-agent-tel><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>Call</a>
  <a href="https://wa.me/14160000000" class="wa" data-agent-wa target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>WhatsApp</a>
</div>

<!-- data.js renders this page; main.js runs after so agent details fill in -->
<script src="js/data.js" defer></script>
<script defer>
document.addEventListener("DOMContentLoaded", () => {
  const id = new URLSearchParams(location.search).get("id");
  const l = LISTINGS.find(x => x.id === id);
  const el = document.getElementById("property");
  if (!l) {
    el.innerHTML = '<p class="empty">This property is no longer available. <a href="listings.html" class="link-arrow" style="color:var(--red)">Browse current listings</a></p>';
    return;
  }
  document.title = `${l.address} | ${formatPrice(l)} | Get Home Realty`;
  document.querySelector('meta[name="description"]').content = `${l.beds} bed, ${l.baths} bath ${l.type.toLowerCase()} at ${l.address}. ${l.description.slice(0, 110)}…`;

  el.innerHTML = `
    <p class="breadcrumb"><a href="index.html">Home</a> / <a href="listings.html">Listings</a> / ${l.city}</p>
    <div class="gallery" style="margin-top:18px">
      ${l.imageUrls.map((u, i) => `<img src="${u}" alt="${l.address} photo ${i + 1}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} decoding="async">`).join("")}
    </div>
    <div class="detail">
      <article>
        <span class="eyebrow">${l.status} · ${l.type}</span>
        <h1 style="margin-top:12px">${l.address}</h1>
        <div class="detail__price">${formatPrice(l)}</div>
        <div class="detail__facts">
          <div><strong>${l.beds}</strong><span>Bedrooms</span></div>
          <div><strong>${l.baths}</strong><span>Bathrooms</span></div>
          <div><strong>${l.sqft.toLocaleString()}</strong><span>Sq. ft.</span></div>
          <div><strong>${l.type}</strong><span>Property type</span></div>
        </div>
        <h2 style="font-size:22px;margin-bottom:10px">About this home</h2>
        <p>${l.description}</p>
      </article>
      <aside class="sidebar">
        <div class="sidebar__agent">
          <img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=160&q=70" alt="" width="62" height="62">
          <div><strong data-agent="name">Ramesh Gollu</strong><br><span style="color:var(--muted);font-size:13px">REALTOR® · Get Home Realty</span></div>
        </div>
        <form id="showing" novalidate>
          <input name="name" placeholder="Your name" required autocomplete="name">
          <input name="phone" type="tel" placeholder="Phone" required autocomplete="tel">
          <input name="email" type="email" placeholder="Email" autocomplete="email">
          <textarea name="msg" rows="3">I'd like to book a showing for ${l.address}.</textarea>
          <button class="btn btn--red" type="submit">Request a Showing</button>
          <a class="btn btn--outline" href="tel:+14160000000" data-agent-tel>Call Now</a>
        </form>
      </aside>
    </div>`;

  // Wire to your CRM / form handler. Falls back to email for now.
  document.getElementById("showing").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = `Name: ${f.get("name")}\nPhone: ${f.get("phone")}\nEmail: ${f.get("email")}\n\n${f.get("msg")}`;
    location.href = `mailto:${AGENT.email}?subject=${encodeURIComponent("Showing request: " + l.address)}&body=${encodeURIComponent(body)}`;
  });

  // Load shared behaviour after content exists so agent fields fill in
  const s = document.createElement("script"); s.src = "js/main.js"; document.body.appendChild(s);
});
</script>
</body>
</html>
